[package]
name = "ankino-diffusion"
version = "0.1.0"
description = "Régie de diffusion vidéo multi-écran par Ankino MG"
authors = ["Ankino MG"]
edition = "2021"

[lib]
name = "ankino_diffusion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
